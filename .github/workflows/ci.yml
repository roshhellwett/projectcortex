name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests & Code Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (53 tests)
        run: npm run unit

      - name: Verify CSS Tokens Integrity
        run: python scripts/css-tokens-check.py

      - name: Verify Chrome Web Store Packaging & Policies
        run: npm run verify

      - name: Verify Distribution Syntax
        run: npm run verify:dist
