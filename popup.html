<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 220px;
      background: #000;
      color: #aaa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
    }

    .hdr {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .hdr svg {
      width: 14px;
      height: 14px;
      opacity: 0.9;
    }

    .hdr-t {
      font-weight: 800;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #fff;
    }

    .hdr-b {
      margin-left: auto;
      font-size: 7px;
      font-weight: 800;
      color: #00d1ff;
      background: rgba(0, 209, 255, 0.1);
      border: 1px solid rgba(0, 209, 255, 0.2);
      border-radius: 4px;
      padding: 2px 5px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .hdr-tg {
      display: block;
      font-size: 6px;
      font-weight: 500;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 1px;
    }

    .bd {
      padding: 12px 14px;
    }

    .btns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ddd;
      font-size: 11px;
      font-weight: 600;
      padding: 9px 8px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-align: center;
      font-family: inherit;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
      border: none;
      color: white;
      box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3), inset 0 2px 4px rgba(255,255,255,0.2);
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #42A5F5 0%, #1E88E5 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4), inset 0 2px 4px rgba(255,255,255,0.3);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
      transform: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 12px 0;
      color: #888;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .loading.visible {
      display: block;
    }

    .loading .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #333;
      border-top-color: #00d1ff;
      border-radius: 50%;
      animation: popSpin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes popSpin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="hdr">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="#ccc" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
    <div>
      <span class="hdr-t">Cortex</span>
      <span class="hdr-tg">Powered by Zenith</span>
    </div>
    <span class="hdr-b">AI</span>
  </div>
  <div class="bd">
    <div class="btns">
      <button class="btn btn-primary" id="openPanel" aria-label="Open the Cortex panel">Open Extension Panel</button>
      <button class="btn" id="summarize" aria-label="Summarize the current page">Summarize Page</button>
      <button class="btn" id="factCheck" aria-label="Fact check selected text">Fact Check</button>
      <button class="btn" id="correctAnswers" aria-label="Find the correct MCQ answer">Correct Answer</button>
      <button class="btn" id="openSettings" aria-label="Open settings and preferences">Settings</button>
    </div>
    <div class="loading" id="loading" aria-live="polite" aria-label="Processing"><span
        class="spinner"></span>Processing...</div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
