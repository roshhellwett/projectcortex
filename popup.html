<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 208px;
      background: linear-gradient(160deg, #08080c 0%, #0c0c14 100%);
      color: #aaa;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif;
      font-size: 11px;
      overflow: hidden;
      animation: pmSpringIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @keyframes pmSpringIn {
      0% { opacity: 0; transform: scale(0.93) translateY(6px); filter: blur(2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    .hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      position: relative;
    }

    .hdr::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.25), rgba(168,85,247,0.25), transparent);
    }

    .hdr-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 3px rgba(168, 85, 247, 0.3));
    }

    .hdr-t {
      font-weight: 800;
      font-size: 10px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pmShine 4s linear infinite;
    }

    @keyframes pmShine {
      to { background-position: 200% center; }
    }

    .hdr-b {
      margin-left: auto;
      font-size: 6px;
      font-weight: 800;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 3px;
      padding: 2px 5px;
      line-height: 1.3;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      box-shadow: 0 0 6px rgba(168, 85, 247, 0.15);
    }

    .hdr-tg {
      display: block;
      font-size: 5.5px;
      font-weight: 500;
      color: #555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.5px;
    }

    .bd { padding: 8px 10px; }

    .cell-group {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      overflow: hidden;
    }

    .cell {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.035);
      color: #ccc;
      font-size: 10.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      will-change: transform;
      width: 100%;
      text-align: left;
      -webkit-appearance: none;
      appearance: none;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.035);
      color: #ccc;
      font-size: 10.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
      will-change: transform;
      width: 100%;
      text-align: left;
      -webkit-appearance: none;
      appearance: none;
    }

    .cell:last-child {
      border-bottom: none;
    }

    .cell::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.04), transparent 60%);
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .cell:hover::after { opacity: 1; }

    .cell:hover {
      background: rgba(255, 255, 255, 0.03);
      color: #fff;
    }

    .cell:active {
      transform: scale(0.98);
      transition-duration: 0.08s;
    }

    .cell-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .cell-icon svg { width: 12px; height: 12px; }

    .cell-label {
      flex: 1;
      line-height: 1.3;
    }

    .cell-chevron {
      color: #444;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .cell-chevron svg { width: 10px; height: 10px; }

    .cell-primary {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border: none;
      color: #fff;
      box-shadow: 0 3px 10px rgba(99, 102, 241, 0.25);
      border-radius: 8px;
      margin-bottom: 6px;
      justify-content: center;
      text-align: center;
    }

    .cell-primary::after { display: none; }

    .cell-primary:hover {
      background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(99, 102, 241, 0.35);
      border: none;
    }

    .cell-primary:active {
      transform: scale(0.97);
    }

    .cell-primary .cell-icon { display: none; }
    .cell-primary .cell-chevron { display: none; }

    .btn:disabled, .cell:disabled {
      opacity: 0.35;
      pointer-events: none;
      transform: none !important;
    }

    .cell:focus-visible, .btn:focus-visible {
      outline: 1.5px solid rgba(168,85,247,0.5);
      outline-offset: -1px;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 10px 0 2px 0;
      color: #888;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .loading.visible {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .loading .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(255, 255, 255, 0.06);
      border-top-color: #a855f7;
      border-right-color: #6366f1;
      border-radius: 50%;
      animation: popSpin 0.75s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes popSpin { to { transform: rotate(360deg); } }

    .ftr {
      text-align: center;
      padding: 7px 10px 8px 10px;
      font-size: 9px;
      color: #444;
      border-top: 1px solid rgba(255, 255, 255, 0.035);
    }

    .ftr a {
      color: rgba(168, 85, 247, 0.6);
      text-decoration: none;
      transition: color 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ftr a:hover { color: #c084fc; }
  </style>
</head>

<body>
  <div class="hdr">
    <svg class="hdr-icon" viewBox="0 0 24 24" fill="none">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="url(#popGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <defs><linearGradient id="popGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient></defs>
    </svg>
    <div>
      <span class="hdr-t">Cortex</span>
      <span class="hdr-tg">Powered by Zenith</span>
    </div>
    <span class="hdr-b">AI</span>
  </div>
  <div class="bd">
    <button class="cell cell-primary btn" id="openPanel" aria-label="Open the Cortex panel">
      <span class="cell-label">Open Extension Panel</span>
    </button>
    <div class="cell-group">
      <button class="cell btn" id="summarize" aria-label="Summarize the current page">
        <span class="cell-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </span>
        <span class="cell-label">Summarize Page</span>
        <span class="cell-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>
      <button class="cell btn" id="factCheck" aria-label="Fact check selected text">
        <span class="cell-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </span>
        <span class="cell-label">Fact Check</span>
        <span class="cell-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>
      <button class="cell btn" id="correctAnswers" aria-label="Find the correct MCQ answer">
        <span class="cell-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
        </span>
        <span class="cell-label">Correct Answer</span>
        <span class="cell-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>
      <button class="cell btn" id="openSettings" aria-label="Open settings and preferences" style="border-bottom: none;">
        <span class="cell-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </span>
        <span class="cell-label">Settings</span>
        <span class="cell-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
      </button>
    </div>
    <div class="loading" id="loading" aria-live="polite" aria-label="Processing">
      <span class="spinner"></span>Processing...
    </div>
    <div class="ftr">
      <a href="mailto:zenithprojects@icloud.com">zenithprojects@icloud.com</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
