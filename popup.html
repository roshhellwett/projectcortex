<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortex — Your Browsing Workspace</title>
  <link rel="icon" type="image/png" href="icons/logo16.png" />
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root { color-scheme: dark; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      margin: 0;
      background: var(--cx-canvas-deep);
      color: var(--cx-text);
      font-family: var(--cx-font-sans);
      font-size: var(--cx-text-body);
      line-height: var(--cx-leading-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Obsidian-Gold Glow */
    body::before {
      content: '';
      position: fixed;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 180px;
      background: radial-gradient(ellipse at center, var(--cx-accent-soft) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    button { font: inherit; cursor: pointer; border: 0; background: transparent; }
    button:focus-visible, a:focus-visible { outline: none; box-shadow: var(--cx-focus-ring); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* === HEADER === */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--cx-space-3) var(--cx-space-4);
      background: var(--cx-glass-strong);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-bottom: 1px solid var(--cx-border);
      box-shadow: var(--cx-elev-1);
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: var(--cx-space-2);
    }

    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: var(--cx-radius-sm);
      background: var(--cx-accent-gradient);
      padding: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--cx-accent-glow);
      flex-shrink: 0;
    }

    .brand-logo-inner {
      width: 100%;
      height: 100%;
      background: var(--cx-canvas-deep);
      border-radius: calc(var(--cx-radius-sm) - 1px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cx-accent-bright);
    }

    .cortex-brand-icon {
      display: block;
      width: 16px;
      height: 16px;
      object-fit: contain;
      filter: brightness(0) saturate(100%) invert(73%) sepia(51%) saturate(996%) hue-rotate(5deg) brightness(94%) contrast(89%);
      transition: transform var(--cx-dur-fast) var(--cx-ease-out), filter var(--cx-dur-fast) var(--cx-ease-out);
    }
    .brand-wrap:hover .cortex-brand-icon {
      transform: scale(1.1);
      filter: brightness(0) saturate(100%) invert(85%) sepia(55%) saturate(1200%) hue-rotate(5deg) brightness(105%) contrast(95%);
    }

    .brand {
      font-size: var(--cx-text-heading);
      font-weight: var(--cx-weight-bold);
      letter-spacing: var(--cx-track-title);
      color: var(--cx-text);
    }

    .version-pill {
      font-family: var(--cx-font-mono);
      font-size: var(--cx-text-label);
      font-weight: var(--cx-weight-semibold);
      letter-spacing: 0.04em;
      color: var(--cx-accent-bright);
      background: var(--cx-badge-gold-bg);
      border: 1px solid var(--cx-badge-gold-border);
      border-radius: var(--cx-radius-full);
      padding: 1px var(--cx-space-2);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--cx-space-1);
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: var(--cx-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cx-text-secondary);
      transition: background-color var(--cx-dur-fast) var(--cx-ease-out),
                  color var(--cx-dur-fast) var(--cx-ease-out),
                  transform var(--cx-dur-fast) var(--cx-ease-out);
    }
    .icon-btn:hover {
      background: var(--cx-surface-hover);
      color: var(--cx-accent-bright);
      transform: translateY(-1px);
    }
    .icon-btn:active {
      transform: scale(0.96);
    }

    /* === MAIN BODY === */
    main {
      padding: var(--cx-space-4);
      display: flex;
      flex-direction: column;
      gap: var(--cx-space-3);
      position: relative;
      z-index: 1;
    }

    /* === ACTIVE TAB CONTEXT CARD === */
    .context-card {
      border: 1px solid var(--cx-border);
      background: var(--cx-glass-soft);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--cx-radius-md);
      padding: var(--cx-space-3);
      box-shadow: var(--cx-elev-1);
      transition: border-color var(--cx-dur-fast) var(--cx-ease-out);
    }
    .context-card:hover {
      border-color: var(--cx-border-strong);
    }

    .context-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--cx-space-2);
    }

    .context-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--cx-text-label);
      font-weight: var(--cx-weight-bold);
      letter-spacing: var(--cx-track-label);
      text-transform: uppercase;
      color: var(--cx-text-secondary);
    }

    .context-reading-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--cx-font-mono);
      font-size: var(--cx-text-micro);
      color: var(--cx-accent-bright);
      background: var(--cx-surface-sunken);
      border: 1px solid var(--cx-border-faint);
      border-radius: var(--cx-radius-xs);
      padding: 1px 6px;
    }
    .context-reading-chip svg { color: var(--cx-accent); }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: var(--cx-radius-full);
      background: var(--cx-signal);
      box-shadow: var(--cx-signal-glow);
    }

    .context-title {
      font-size: var(--cx-text-heading);
      font-weight: var(--cx-weight-semibold);
      letter-spacing: -0.01em;
      color: var(--cx-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: var(--cx-space-1);
    }

    .context-host-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--cx-font-mono);
      font-size: var(--cx-text-micro);
      color: var(--cx-text-secondary);
      background: var(--cx-surface-sunken);
      border: 1px solid var(--cx-border-faint);
      border-radius: var(--cx-radius-xs);
      padding: 2px 7px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .context-host-pill svg { color: var(--cx-accent); flex-shrink: 0; }

    /* === ACTION BUTTONS === */
    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: 0;
      border-radius: var(--cx-radius-md);
      padding: var(--cx-space-3) var(--cx-space-4);
      background: var(--cx-accent-gradient);
      color: var(--cx-on-accent);
      font-weight: var(--cx-weight-bold);
      font-size: 13.5px;
      box-shadow: var(--cx-accent-glow), var(--cx-elev-2);
      transition: filter var(--cx-dur-fast) var(--cx-ease-out),
                  transform var(--cx-dur-fast) var(--cx-ease-out),
                  box-shadow var(--cx-dur-fast) var(--cx-ease-out);
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(212, 160, 23, 0.4), var(--cx-elev-2);
    }
    .btn-primary:active:not(:disabled) {
      filter: brightness(0.96);
      transform: scale(0.98);
    }

    .btn-primary-inner {
      display: flex;
      align-items: center;
      gap: var(--cx-space-2);
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: 1px solid var(--cx-border-soft);
      border-radius: var(--cx-radius-md);
      padding: var(--cx-space-2) var(--cx-space-4);
      background: var(--cx-glass-soft);
      color: var(--cx-text);
      font-size: var(--cx-text-body);
      font-weight: var(--cx-weight-semibold);
      box-shadow: var(--cx-elev-1);
      transition: background-color var(--cx-dur-fast) var(--cx-ease-out),
                  border-color var(--cx-dur-fast) var(--cx-ease-out),
                  transform var(--cx-dur-fast) var(--cx-ease-out);
    }
    .btn-secondary:hover:not(:disabled) {
      background: var(--cx-surface-hover);
      border-color: var(--cx-border);
      color: var(--cx-accent-bright);
      transform: translateY(-1px);
    }
    .btn-secondary:active:not(:disabled) {
      background: var(--cx-surface-active);
      transform: scale(0.98);
    }

    .btn-secondary-inner {
      display: flex;
      align-items: center;
      gap: var(--cx-space-2);
    }

    kbd {
      font-family: var(--cx-font-mono);
      font-size: var(--cx-text-label);
      font-weight: var(--cx-weight-semibold);
      color: var(--cx-text-secondary);
      background: var(--cx-surface-sunken);
      border: 1px solid var(--cx-border-faint);
      border-radius: var(--cx-radius-xs);
      padding: 2px 7px;
      white-space: nowrap;
    }

    /* === QUICK ACTIONS GRID === */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--cx-space-1);
    }
    .section-head h2 {
      font-size: var(--cx-text-small);
      font-weight: var(--cx-weight-bold);
      letter-spacing: -0.01em;
      color: var(--cx-text);
    }
    .section-head span {
      font-size: var(--cx-text-micro);
      color: var(--cx-text-tertiary);
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--cx-space-2);
    }

    .action-card {
      display: flex;
      flex-direction: column;
      gap: var(--cx-space-2);
      text-align: left;
      padding: var(--cx-space-3);
      border: 1px solid var(--cx-border-soft);
      border-radius: var(--cx-radius-md);
      background: var(--cx-glass-soft);
      color: var(--cx-text);
      box-shadow: var(--cx-elev-1);
      position: relative;
      overflow: hidden;
      transition: background-color var(--cx-dur-fast) var(--cx-ease-out),
                  border-color var(--cx-dur-fast) var(--cx-ease-out),
                  transform var(--cx-dur-fast) var(--cx-ease-out),
                  box-shadow var(--cx-dur-fast) var(--cx-ease-out);
    }
    .action-card:hover:not(:disabled) {
      background: var(--cx-surface-hover);
      border-color: var(--cx-border);
      transform: translateY(-1.5px);
      box-shadow: var(--cx-elev-2);
    }
    .action-card:active:not(:disabled) {
      background: var(--cx-surface-active);
      transform: scale(0.97);
    }

    .action-icon-wrap {
      width: 28px;
      height: 28px;
      border-radius: var(--cx-radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cx-surface-sunken);
      color: var(--cx-accent-bright);
      border: 1px solid var(--cx-border-faint);
      transition: background-color var(--cx-dur-fast) var(--cx-ease-out),
                  color var(--cx-dur-fast) var(--cx-ease-out);
    }
    .action-icon-wrap--signal {
      color: var(--cx-signal);
      background: var(--cx-badge-signal-bg);
      border-color: var(--cx-badge-signal-border);
    }
    .action-card:hover:not(:disabled) .action-icon-wrap {
      background: var(--cx-badge-gold-bg);
      border-color: var(--cx-badge-gold-border);
    }

    .action-meta strong {
      display: block;
      font-size: 12.5px;
      font-weight: var(--cx-weight-semibold);
      letter-spacing: -0.01em;
      color: var(--cx-text);
      margin-bottom: 2px;
    }
    .action-meta span {
      display: block;
      font-size: var(--cx-text-micro);
      color: var(--cx-text-tertiary);
      line-height: 1.35;
    }

    /* === STATUS & HINTS === */
    .telemetry-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--cx-text-micro);
      color: var(--cx-text-tertiary);
      padding: var(--cx-space-1) var(--cx-space-2);
      background: var(--cx-surface-sunken);
      border: 1px solid var(--cx-border-faint);
      border-radius: var(--cx-radius-sm);
    }
    .telemetry-hint svg { color: var(--cx-accent); flex-shrink: 0; }

    #status {
      font-size: var(--cx-text-small);
      color: var(--cx-text-secondary);
      text-align: center;
      padding: var(--cx-space-1) 0;
    }
    #status:empty { display: none; }

    #pm-error {
      font-size: var(--cx-text-small);
      color: var(--cx-danger);
      border-left: 3px solid var(--cx-danger);
      background: var(--cx-danger-faint);
      border-radius: 0 var(--cx-radius-xs) var(--cx-radius-xs) 0;
      padding: var(--cx-space-2) var(--cx-space-3);
      line-height: 1.4;
    }
    #pm-error[hidden] { display: none; }

    /* === FOOTER === */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--cx-space-3) var(--cx-space-4);
      background: var(--cx-glass-strong);
      border-top: 1px solid var(--cx-border-soft);
      font-size: var(--cx-text-micro);
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--cx-text-tertiary);
      font-weight: var(--cx-weight-medium);
    }
    .footer-brand-dot {
      width: 5px;
      height: 5px;
      border-radius: var(--cx-radius-full);
      background: var(--cx-accent);
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: var(--cx-space-3);
    }

    .footer-btn {
      background: none;
      color: var(--cx-text-secondary);
      border: 0;
      padding: 0;
      font-size: var(--cx-text-micro);
      font-weight: var(--cx-weight-semibold);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color var(--cx-dur-fast) var(--cx-ease-out);
    }
    .footer-btn:hover {
      color: var(--cx-accent-bright);
    }

    footer a {
      color: var(--cx-text-secondary);
      text-decoration: none;
      transition: color var(--cx-dur-fast) var(--cx-ease-out);
    }
    footer a:hover {
      color: var(--cx-accent-bright);
    }

    /* Contract: Reduced motion & Focus rings */
    :where(button, a[href], input, select, textarea, [tabindex]):focus-visible {
      outline: none;
      box-shadow: var(--cx-focus-ring);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-logo" aria-hidden="true">
        <div class="brand-logo-inner">
          <img src="icons/logo48.png" width="16" height="16" class="cortex-brand-icon" alt="Project Cortex" />
        </div>
      </div>
      <span class="brand">Cortex</span>
      <span id="popup-version" class="version-pill">v11.3.0</span>
    </div>
    <div class="header-actions">
      <button id="openSettingsHeader" class="icon-btn" aria-label="Open Settings" title="Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- Active Tab Context Card -->
    <section class="context-card" aria-label="Current page">
      <div class="context-header">
        <div class="context-badge">
          <span class="status-dot"></span>
          <span>Active Context</span>
        </div>
        <div id="pageReadingChip" class="context-reading-chip" style="display: none;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span id="pageReadingTime">-- min read</span>
        </div>
      </div>
      <div id="pageTitle" class="context-title">Checking page…</div>
      <div class="context-host-pill" title="Current host">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span id="pageHost">Reading active tab…</span>
      </div>
    </section>

    <!-- Primary & Secondary Launcher CTAs -->
    <button id="openPanel" class="btn-primary" data-action="open_panel" disabled>
      <span class="btn-primary-inner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 16v-4"></path>
          <path d="M12 8h.01"></path>
        </svg>
        <span>Ask about this page</span>
      </span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </button>

    <button id="openPalette" class="btn-secondary" data-action="command_palette" disabled>
      <span class="btn-secondary-inner">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--cx-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Command Center</span>
      </span>
      <kbd>Alt + K</kbd>
    </button>

    <!-- Quick Actions Section -->
    <div class="section-head">
      <h2>Quick Actions</h2>
      <span>Stay in your flow</span>
    </div>

    <div class="actions-grid">
      <button id="summarize" class="action-card" data-action="summarize" disabled>
        <div class="action-icon-wrap" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <line x1="10" y1="9" x2="8" y2="9"></line>
          </svg>
        </div>
        <div class="action-meta">
          <strong>Summarize</strong>
          <span>Key takeaways &amp; tl;dr</span>
        </div>
      </button>

      <button id="define" class="action-card" data-action="define" disabled>
        <div class="action-icon-wrap" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
        </div>
        <div class="action-meta">
          <strong>Explain a term</strong>
          <span>Clear breakdown</span>
        </div>
      </button>

      <button id="factCheck" class="action-card" data-action="factcheck" disabled>
        <div class="action-icon-wrap action-icon-wrap--signal" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
